version: '3.8'

services:
  # База данных с PostGIS
  motodb:
    image: postgis/postgis:16-3.4
    container_name: moto_trip_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: motodb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Локальное S3-хранилище для фото профилей (Аналог AWS S3)
  minio:
    image: minio/minio:RELEASE.2024-01-11T04-46-38Z
    container_name: moto_media_storage
    ports:
      - "9000:9000" # API для Java-бэкенда
      - "9001:9001" # Консоль управления (браузер)
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # Брокер сообщений для SOS-маяков и WebSocket-событий
  kafka:
    image: apache/kafka:3.7.0
    container_name: moto_event_broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    restart: unless-stopped

  # Сам наш бэкенд-проект на Java 17
  app:
    image: moto-trip-dates-backend:1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moto_backend_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://motodb:5432/motodb
      SPRING_R2DBC_URL: r2dbc:postgresql://motodb:5432/motodb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      motodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local

